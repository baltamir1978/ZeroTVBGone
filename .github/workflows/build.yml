name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lo mismo que en local: pruebas en el simulador y .deb para el Cardputer Zero.
      - name: Pruebas y paquete
        run: Tools/compilar.sh todo
      - uses: actions/upload-artifact@v4
        with:
          name: zerotvbgone-deb
          path: dist/*.deb
